name: Build web app

on:
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: Deploy the built website to Cloudflare Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build static website
        run: npm run build
      - name: Upload website
        uses: actions/upload-artifact@v7
        with:
          name: pathos-web
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy to Cloudflare Pages
        if: inputs.deploy_to_cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Add the CLOUDFLARE_PAGES_PROJECT repository variable}"
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo '::error::Select a repository branch to deploy to Cloudflare Pages.'
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"
