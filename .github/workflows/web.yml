name: Build web app

on:
  workflow_call:
    inputs:
      deploy_to_cloudflare:
        type: boolean
        default: false
      create_pages_project:
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: Deploy the built website to Cloudflare Pages
        type: boolean
        default: false
      create_pages_project:
        description: Create the configured Pages project if it does not exist
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build static website
        run: npm run build
      - name: Upload website
        uses: actions/upload-artifact@v7
        with:
          name: pathos-web
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy to Cloudflare Pages
        if: inputs.deploy_to_cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CREATE_PAGES_PROJECT: ${{ inputs.create_pages_project }}
          PAGES_PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Add the CLOUDFLARE_PAGES_PROJECT repository variable}"
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo '::error::Select a repository branch to deploy to Cloudflare Pages.'
            exit 1
          fi
          if [[ "$CREATE_PAGES_PROJECT" == true ]]; then
            # List first: authentication/network errors must fail the step rather
            # than being interpreted as a missing project.
            projects_file="$RUNNER_TEMP/pathos-pages-projects.json"
            npx --yes wrangler@4 pages project list --json > "$projects_file"
            project_exists="$(node --input-type=module - "$projects_file" <<'JS'
          import {readFileSync} from 'node:fs';
          const projects = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(projects) || projects.some(project => typeof project['Project Name'] !== 'string')) {
            throw new Error('Unexpected response from wrangler pages project list.');
          }
          console.log(projects.some(project => project['Project Name'] === process.env.CLOUDFLARE_PAGES_PROJECT));
          JS
            )"
            if [[ "$project_exists" == false ]]; then
              npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" \
                --production-branch "$PAGES_PRODUCTION_BRANCH"
            fi
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"
